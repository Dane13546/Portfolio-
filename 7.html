<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zesta Sparkling Water | Billboard</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#17131f;padding:28px 14px 56px}
  .stack{max-width:1240px;margin:0 auto;display:grid;gap:28px}
  .art{line-height:0;box-shadow:0 12px 40px rgba(0,0,0,.5);border:10px solid #23202c;border-radius:3px;background:#23202c}

  .scene{line-height:0;border-radius:6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <radialGradient id="gFlesh"><stop offset="0" stop-color="#ff6b43"/><stop offset="1" stop-color="#c3261a"/></radialGradient>
    <linearGradient id="gCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d6" stop-opacity=".4"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/></linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17133a"/><stop offset=".5" stop-color="#6a2f86"/><stop offset=".82" stop-color="#ff8f5a"/><stop offset="1" stop-color="#ffc07a"/></linearGradient>

    <radialGradient id="gSun"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>

    <symbol id="dr" viewBox="-4 -4 8 8"><circle r="3" fill="#fff" fill-opacity=".26" stroke="#fff" stroke-opacity=".6" stroke-width=".6"/><circle cx="-1" cy="-1.1" r=".9" fill="#fff"/></symbol>

      </g>
      <path d="M54 46H146Q162 60 166 90V330Q164 352 148 364L144 372H56L52 364Q36 352 34 330V90Q38 60 54 46Z" fill="url(#gCylM)"/>
      <path d="M52 364Q100 378 148 364L144 372Q100 382 56 372Z" fill="url(#gMetalTop)"/>
      <path d="M54 46H146Q150 46 150 41V37H50V41Q50 46 54 46Z" fill="url(#gMetalTop)"/>

      <rect x="84" y="31.5" width="30" height="11" rx="5.5" fill="#e6e9ec" stroke="#9aa0a8" stroke-width=".8"/>

      <g>
        <use href="#dr" x="50" y="108" width="8" height="8"/><use href="#dr" x="136" y="124" width="9" height="9"/><use href="#dr" x="150" y="168" width="6" height="6"/>

      <rect width="1440" height="420" fill="url(#gBoard)"/>

      <g fill="#fff"><circle cx="880" cy="70" r="8" fill-opacity=".7"/><circle cx="1110" cy="46" r="5" fill-opacity=".7"/><circle cx="1130" cy="388" r="6" fill-opacity=".6"/><circle cx="906" cy="380" r="9" fill-opacity=".55"/><circle cx="1240" cy="352" r="5" fill-opacity=".6"/></g>

      <text x="64" y="352" font-family="Arial Black,Impact,sans-serif" font-size="176" fill="#1d1230" textLength="760" lengthAdjust="spacingAndGlyphs">LOUDER.</text>
      <text x="68" y="398" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff4e0">Blood orange sparkling water. Zero sugar.</text>

      <g transform="translate(1388 366)" text-anchor="end">
        <text y="0" font-family="Arial Black,Impact,sans-serif" font-size="34" fill="#1d1230" letter-spacing="2">ZESTA</text>
        <text y="26" font-family="Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d1230">drinkzesta.example</text>
      </g>

</svg>

<div class="stack">

    <svg viewBox="0 0 1440 420" role="img" aria-label="Zesta billboard: Chill louder. Blood orange sparkling water. Zero sugar."><use href="#board" width="1440" height="420"/></svg>

      <rect width="1400" height="760" fill="url(#gSky)"/>
      <circle cx="1120" cy="590" r="260" fill="url(#gSun)"/>
      <g fill="#fff"><circle cx="110" cy="70" r="1.6"/><circle cx="260" cy="40" r="1.2"/><circle cx="420" cy="96" r="1.5"/><circle cx="640" cy="52" r="1.2"/><circle cx="820" cy="84" r="1.6"/><circle cx="1010" cy="38" r="1.3"/><circle cx="1230" cy="92" r="1.5"/><circle cx="1330" cy="46" r="1.2"/><circle cx="60" cy="150" r="1.2"/><circle cx="520" cy="150" r="1"/></g>

      <g fill="#ffd88a" opacity=".8">

      <ellipse cx="1120" cy="740" rx="60" ry="6" fill="#fff4d6" opacity=".4"/>

      <!-- posts and catwalk -->

      <rect x="404" y="676" width="58" height="12" fill="#101018"/><rect x="938" y="676" width="58" height="12" fill="#101018"/>

</div>
</body>
