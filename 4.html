<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailform Season Opener | Campaign Banners</title>
<style>
  :root{--blue:#2447f5;--lime:#d8ff3e;--bone:#f4f3ee;--ink:#0b0d14}
  *{box-sizing:border-box}
  body{margin:0;background:#dfe1e8;padding:28px 14px 48px;font-family:"Helvetica Neue",Arial,sans-serif}
  .board{max-width:1120px;margin:0 auto;display:grid;gap:28px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
  .art{background:#fff;box-shadow:0 6px 24px rgba(11,13,20,.18);line-height:0;overflow:hidden}
  .art svg{width:100%;height:auto;display:block}
  .narrow{max-width:728px;margin:0 auto;width:100%}
  .story{max-width:420px;margin:0 auto;width:100%}
  @media(max-width:760px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="jacket" viewBox="0 0 160 180">
      <path d="M58 12L24 30 10 122l26 6 10-66v108h68V62l10 66 26-6-14-92-34-18Q80 34 58 12z" fill="var(--c,#0b0d14)"/>
      <path d="M58 12Q80 36 102 12v10Q80 46 58 22z" fill="var(--t,#d8ff3e)"/>
      <rect x="46" y="92" width="68" height="9" fill="var(--t,#d8ff3e)"/>
      <path d="M10 122l26 6" stroke="var(--t,#d8ff3e)" stroke-width="9"/><path d="M150 122l-26 6" stroke="var(--t,#d8ff3e)" stroke-width="9"/>
      <line x1="80" y1="36" x2="80" y2="170" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
      <rect x="52" y="124" width="20" height="3" rx="1.5" fill="#fff" opacity=".4"/><rect x="88" y="124" width="20" height="3" rx="1.5" fill="#fff" opacity=".4"/>
      <path d="M92 70l5 8 5-8" fill="none" stroke="#fff" stroke-opacity=".0"/>
    </symbol>
    <symbol id="tee" viewBox="0 0 120 120">
      <path d="M40 10L18 22 6 46l18 8 8-10v66h56V44l8 10 18-8-12-24L80 10Q60 26 40 10z" fill="var(--c,#f4f3ee)"/>
      <path d="M40 10Q60 26 80 10l-4-2Q60 20 44 8z" fill="var(--t,#2447f5)"/>
      <rect x="32" y="70" width="56" height="7" fill="var(--t,#2447f5)" opacity=".9"/>
    </symbol>
    <symbol id="tights" viewBox="0 0 120 200">
      <path d="M30 8h60l8 182H66L60 76l-6 114H22z" fill="var(--c,#0b0d14)"/>
      <rect x="30" y="8" width="60" height="14" fill="var(--t,#d8ff3e)"/>
      <path d="M33 22l-9 168" stroke="var(--t,#d8ff3e)" stroke-width="4"/><path d="M87 22l9 168" stroke="var(--t,#d8ff3e)" stroke-width="4"/>
    </symbol>
    <symbol id="beanie" viewBox="0 0 120 100">
      <path d="M18 70Q18 18 60 18T102 70z" fill="var(--c,#2447f5)"/>
      <rect x="14" y="66" width="92" height="20" rx="6" fill="var(--t,#d8ff3e)"/>
      <circle cx="60" cy="14" r="9" fill="var(--t,#d8ff3e)"/>
    </symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="mark" viewBox="0 0 40 40"><path d="M4 30L18 8l7 12 4-6 7 16z" fill="currentColor"/></symbol>
    <pattern id="diag" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="10" height="28" fill="#fff" opacity=".07"/></pattern>
  </defs>
</svg>

<div class="board">

  <!-- Web hero 1440 x 600 -->
  <div class="art">
    <svg viewBox="0 0 1440 600" role="img" aria-label="Trailform Season Opener, up to 40 percent off performance layers">
      <rect width="1440" height="600" fill="#2447f5"/><rect width="1440" height="600" fill="url(#diag)"/>
      <circle cx="1090" cy="310" r="250" fill="#d8ff3e"/>
      <circle cx="1090" cy="310" r="250" fill="none" stroke="#0b0d14" stroke-width="3" stroke-dasharray="3 12" transform="scale(1.12) translate(-130 -37)"/>
      <use href="#tights" x="1062" y="190" width="150" height="250" style="--c:#0b0d14;--t:#2447f5"/>
      <use href="#jacket" x="900" y="150" width="270" height="304" style="--c:#0b0d14;--t:#2447f5"/>
      <use href="#tee" x="1180" y="330" width="170" height="170" style="--c:#f4f3ee;--t:#2447f5"/>
      <use href="#beanie" x="1010" y="70" width="140" height="117" style="--c:#2447f5;--t:#f4f3ee"/>

      <g color="#f4f3ee"><use href="#mark" x="80" y="70" width="34" height="34"/></g>
      <text x="124" y="97" font-family="Arial Black,Impact,sans-serif" font-size="26" fill="#f4f3ee" letter-spacing="3">TRAILFORM</text>

      <text x="80" y="236" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#d8ff3e">SEASON OPENER</text>
      <text x="76" y="342" font-family="Arial Black,Impact,sans-serif" font-size="118" fill="#f4f3ee" letter-spacing="-3">UP TO</text>
      <text x="76" y="446" font-family="Arial Black,Impact,sans-serif" font-size="118" fill="#f4f3ee" letter-spacing="-3">40% OFF</text>
      <rect x="80" y="486" width="268" height="62" rx="31" fill="#d8ff3e"/>
      <text x="114" y="526" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="800" fill="#0b0d14">Shop the sale</text>
      <g color="#0b0d14"><use href="#arrow" x="300" y="505" width="26" height="26"/></g>
      <text x="376" y="525" font-family="Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="600" fill="#f4f3ee" opacity=".85">Ends Sunday at midnight</text>
    </svg>
  </div>

  <!-- Leaderboard 728 x 90 -->
  <div class="art narrow">
    <svg viewBox="0 0 728 90" role="img" aria-label="Trailform Season Opener banner, up to 40 percent off">
      <rect width="728" height="90" fill="#0b0d14"/>
      <rect x="0" y="0" width="190" height="90" fill="#2447f5"/>
      <g color="#d8ff3e"><use href="#mark" x="16" y="26" width="34" height="34"/></g>
      <text x="58" y="52" font-family="Arial Black,Impact,sans-serif" font-size="17" fill="#f4f3ee" letter-spacing="2">TRAILFORM</text>
      <polygon points="190,0 214,0 190,90" fill="#2447f5"/>
      <text x="236" y="38" font-family="Helvetica Neue,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#d8ff3e">SEASON OPENER</text>
      <text x="236" y="70" font-family="Arial Black,Impact,sans-serif" font-size="30" fill="#f4f3ee" letter-spacing="-.5">UP TO 40% OFF</text>
      <use href="#jacket" x="480" y="8" width="72" height="80" style="--c:#2447f5;--t:#d8ff3e"/>
      <use href="#tee" x="548" y="22" width="52" height="52" style="--c:#f4f3ee;--t:#2447f5"/>
      <rect x="610" y="26" width="98" height="38" rx="19" fill="#d8ff3e"/>
      <text x="628" y="50" font-family="Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b0d14">Shop now</text>
    </svg>
  </div>

  <div class="row">
    <!-- Social square 1080 x 1080 -->
    <div class="art">
      <svg viewBox="0 0 1080 1080" role="img" aria-label="Trailform social ad, 40 percent off">
        <rect width="1080" height="1080" fill="#d8ff3e"/>
        <path d="M0 640Q300 520 540 620T1080 560V1080H0Z" fill="#2447f5"/>
        <path d="M0 780Q320 680 560 760T1080 720V1080H0Z" fill="#0b0d14"/>
        <g color="#0b0d14"><use href="#mark" x="64" y="62" width="40" height="40"/></g>
        <text x="116" y="94" font-family="Arial Black,Impact,sans-serif" font-size="30" fill="#0b0d14" letter-spacing="3">TRAILFORM</text>
        <text x="64" y="214" font-family="Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="8" fill="#0b0d14">SEASON OPENER</text>
        <text x="54" y="450" font-family="Arial Black,Impact,sans-serif" font-size="290" fill="#0b0d14" letter-spacing="-12">40%</text>
        <text x="64" y="530" font-family="Arial Black,Impact,sans-serif" font-size="78" fill="#2447f5">OFF LAYERS</text>
        <use href="#jacket" x="640" y="270" width="380" height="428" style="--c:#2447f5;--t:#d8ff3e"/>
        <use href="#tights" x="470" y="580" width="150" height="250" style="--c:#0b0d14;--t:#d8ff3e"/>
        <rect x="64" y="900" width="420" height="92" rx="46" fill="#d8ff3e"/>
        <text x="106" y="958" font-family="Helvetica Neue,Arial,sans-serif" font-size="34" font-weight="800" fill="#0b0d14">Shop the sale</text>
        <g color="#0b0d14"><use href="#arrow" x="400" y="927" width="38" height="38"/></g>
        <text x="1016" y="958" text-anchor="end" font-family="Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="600" fill="#f4f3ee">trailform.example</text>
      </svg>
    </div>

    <!-- Story 1080 x 1920 -->
    <div class="art story">
      <svg viewBox="0 0 1080 1920" role="img" aria-label="Trailform story ad, new season new pace">
        <rect width="1080" height="1920" fill="#2447f5"/><rect width="1080" height="1920" fill="url(#diag)"/>
        <circle cx="540" cy="860" r="400" fill="#d8ff3e"/>
        <g color="#f4f3ee"><use href="#mark" x="64" y="130" width="44" height="44"/></g>
        <text x="120" y="164" font-family="Arial Black,Impact,sans-serif" font-size="34" fill="#f4f3ee" letter-spacing="4">TRAILFORM</text>
        <text x="64" y="320" font-family="Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="9" fill="#d8ff3e">SEASON OPENER</text>
        <text x="60" y="450" font-family="Arial Black,Impact,sans-serif" font-size="128" fill="#f4f3ee" letter-spacing="-3">NEW</text>
        <text x="60" y="566" font-family="Arial Black,Impact,sans-serif" font-size="128" fill="#f4f3ee" letter-spacing="-3">SEASON.</text>
        <use href="#tights" x="500" y="760" width="190" height="316" style="--c:#0b0d14;--t:#2447f5"/>
        <use href="#jacket" x="250" y="660" width="460" height="518" style="--c:#0b0d14;--t:#2447f5"/>
        <use href="#beanie" x="640" y="640" width="190" height="158" style="--c:#2447f5;--t:#f4f3ee"/>
        <text x="60" y="1360" font-family="Arial Black,Impact,sans-serif" font-size="128" fill="#d8ff3e" letter-spacing="-3">NEW PACE.</text>
        <text x="64" y="1440" font-family="Helvetica Neue,Arial,sans-serif" font-size="36" font-weight="600" fill="#f4f3ee">Up to 40% off performance layers.</text>
        <rect x="64" y="1520" width="952" height="120" rx="60" fill="#d8ff3e"/>
        <text x="540" y="1597" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="42" font-weight="800" fill="#0b0d14">Shop the sale</text>
        <text x="540" y="1740" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="6" fill="#f4f3ee">SWIPE UP</text>
        <path d="M512 1790l28-26 28 26" fill="none" stroke="#f4f3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
